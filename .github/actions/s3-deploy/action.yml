name: 'Deploy to S3'
description: 'Deploy static assets to AWS S3 and invalidate CloudFront cache'

inputs:
  role-to-assume:
    description: 'ARN of the IAM role to assume'
    required: true
  bucket-name:
    description: 'Name of the S3 bucket to deploy to'
    required: true
  cloudfront-distribution-id:
    description: 'CloudFront distribution ID for cache invalidation'
    required: true
  build-output-path:
    description: 'Path to the build output directory'
    required: false
    default: 'dist'
  aws-region:
    description: 'AWS region'
    required: false
    default: 'ap-northeast-2'

runs:
  using: 'composite'
  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.role-to-assume }}

    - name: Sync S3 Bucket
      run: aws s3 sync ${{ inputs.build-output-path }} s3://${{ inputs.bucket-name }} --delete
      shell: bash

    - name: Invalidate CloudFront Distribution
      run: aws cloudfront create-invalidation --distribution-id ${{ inputs.cloudfront-distribution-id }} --paths "/*"
      shell: bash
